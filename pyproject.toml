[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-control-plane"
version = "0.1.0a1"
description = "Durable context, task state, evidence, and collaboration control for AI-assisted software work"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Continuity Plane contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "PyYAML>=6.0.3,<7",
  "jsonschema>=4.25.1,<5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.4,<4"]
dev = [
  "build>=1.3,<2",
  "psycopg[binary]>=3.3.4,<4",
  "ruff>=0.12,<1",
]

[project.scripts]
context-control-plane = "context_control_plane.cli:main"
continuity = "context_control_plane.cli:main"

[tool.setuptools.packages.find]
include = ["context_control_plane", "context_control_plane.*"]

[tool.setuptools.package-data]
context_control_plane = [
  "database/**/*.sql",
  "schemas/**/*.json",
  "templates/*.md",
  "templates/*.yaml",
]

[tool.ruff.lint]
select = ["E4", "E9", "F"]
