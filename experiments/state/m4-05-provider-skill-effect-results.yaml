limitations:
- The receipt measures local Context Control Plane delivery-plan construction and
  replay, not provider process execution.
- Codex and Claude surface contracts are Context Control Plane adapter contracts,
  not provider-owned wire protocols.
- Provider input tokens, billable tokens, cache behavior, rule following, context-window
  use and compaction recovery are unmeasured.
- State-port calls are outside this adapter probe; effects only declare zero runtime-state
  write authority.
- Scenario labels identify byte-distinct synthetic compositions and do not execute
  the named typed workflow behaviors.
- The probe uses a synthetic allow-list plan authorizer and frozen clock; actor and
  state-revision authorization are unmeasured.
- Latency is local Python timing on one host and is not cryptographically attested.
