limitations:
- Results describe one host and do not predict every device.
- The timed boundary includes packet, drift, binding and content digest validation
  plus in-memory Skill selection.
- The benchmark uses a synthetic allow-list authorizer and frozen clock; State MCP
  revision, actor, expiry and live-time authorization remain M4-09/M8 integration
  work.
- All verified Skill bytes are resident in memory; this result does not measure source
  or filesystem read reduction.
- Selected Skill content bytes are a composition proxy, not provider input tokens,
  billable tokens or prompt-cache behavior.
- Provider adapters, end-to-end restore and live compaction remain M4-05 and M5 work.
- Latency samples are trusted local-runner evidence; cryptographic CI or OTel timing
  attestation remains M8 work.
