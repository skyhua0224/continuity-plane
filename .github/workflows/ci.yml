name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --editable '.[dev]'
      - run: ruff check .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q continuity_plane tests
      - run: continuity --version

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --editable '.[webhooks]'
      - run: continuity --version
      - run: python -m unittest tests.test_windows_portability tests.test_a38_owner_sinks tests.test_a38_owner_channel tests.test_a36_collab_hotpath
