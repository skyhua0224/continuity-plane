name: CI

# Requires a registered Gitea Actions runner.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  repository-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL
        run: |
          set -eu
          POSTGRES_IMAGE="postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15"
          POSTGRES_CONTAINER="ccp-m203-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          printf 'CONTEXT_TEST_POSTGRES_CONTAINER=%s\n' "${POSTGRES_CONTAINER}" >> "${GITHUB_ENV}"
          DOCKER_NETWORK_ARGS=()
          if docker inspect "${HOSTNAME}" >/dev/null 2>&1; then
            JOB_NETWORK="$(docker inspect "${HOSTNAME}" \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
              | head -n 1)"
            test -n "${JOB_NETWORK}"
            DOCKER_NETWORK_ARGS=(--network "${JOB_NETWORK}")
            POSTGRES_HOST="${POSTGRES_CONTAINER}"
            POSTGRES_PORT="5432"
          else
            DOCKER_NETWORK_ARGS=(--publish "127.0.0.1::5432")
            POSTGRES_HOST="127.0.0.1"
            POSTGRES_PORT=""
          fi
          docker run --rm -d \
            --name "${POSTGRES_CONTAINER}" \
            "${DOCKER_NETWORK_ARGS[@]}" \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_USER=context_test \
            --env POSTGRES_DB=context_test \
            "${POSTGRES_IMAGE}"
          if [ -z "${POSTGRES_PORT}" ]; then
            POSTGRES_PORT="$(docker port "${POSTGRES_CONTAINER}" 5432/tcp \
              | awk -F: 'NR == 1 {print $NF}')"
            test -n "${POSTGRES_PORT}"
          fi
          CONTEXT_TEST_POSTGRES_DSN="postgresql://context_test@${POSTGRES_HOST}:${POSTGRES_PORT}/context_test"
          printf 'CONTEXT_TEST_POSTGRES_DSN=%s\n' "${CONTEXT_TEST_POSTGRES_DSN}" >> "${GITHUB_ENV}"
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "${POSTGRES_CONTAINER}" pg_isready \
              --username context_test --dbname context_test; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            docker logs "${POSTGRES_CONTAINER}"
            exit 1
          fi
      - name: Set up isolated Python
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt
      - name: Unit, contract, fixture privacy, and benchmark tests
        run: .venv/bin/python -m unittest discover -s tests -p "test_*.py"
      - name: Python compile
        run: .venv/bin/python -m compileall -q context_control_plane tests tools
      - name: Governance, schema, data, admission, link, and style gates
        run: .venv/bin/python tools/verify_repository.py --root .
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          if [ -n "${CONTEXT_TEST_POSTGRES_CONTAINER:-}" ]; then
            docker stop "${CONTEXT_TEST_POSTGRES_CONTAINER}" || true
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" -o "/tmp/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "/tmp/${GITLEAKS_ARCHIVE}" | sha256sum --check
          tar -xzf "/tmp/${GITLEAKS_ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --config .gitleaks.toml
