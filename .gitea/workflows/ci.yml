name: CI

# Requires a registered Gitea Actions runner.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  repository-verification:
    runs-on: ubuntu-latest
    env:
      CONTEXT_TEST_POSTGRES_DSN: postgresql://context_test@127.0.0.1:5432/context_test
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: context_test
          POSTGRES_DB: context_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U context_test -d context_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up isolated Python
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt
      - name: Unit, contract, fixture privacy, and benchmark tests
        run: .venv/bin/python -m unittest discover -s tests -p "test_*.py"
      - name: Python compile
        run: .venv/bin/python -m compileall -q context_control_plane tests tools
      - name: Governance, schema, data, admission, link, and style gates
        run: .venv/bin/python tools/verify_repository.py --root .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" -o "/tmp/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "/tmp/${GITLEAKS_ARCHIVE}" | sha256sum --check
          tar -xzf "/tmp/${GITLEAKS_ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --config .gitleaks.toml
