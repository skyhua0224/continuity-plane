name: CI

# Requires a registered Gitea Actions runner.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  repository-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install verification dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Unit, contract, fixture privacy, and benchmark tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Python compile
        run: python -m compileall -q context_control_plane tests tools
      - name: Governance, schema, data, admission, link, and style gates
        run: python tools/verify_repository.py --root .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" -o "/tmp/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "/tmp/${GITLEAKS_ARCHIVE}" | sha256sum --check
          tar -xzf "/tmp/${GITLEAKS_ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --config .gitleaks.toml
